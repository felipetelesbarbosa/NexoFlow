[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexoflow"
version = "1.5.35"
description = "Sincronização de contatos e pedidos entre Weni, a API FarmaLíder e Google Sheets nos segmentos FarmaLíder e Pets Líder."
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
package-dir = {"" = "app", "connectors.meta_ads_mcp" = "connectors/meta_ads_mcp"}
packages = ["connectors.meta_ads_mcp"]
# Módulos públicos explícitos: configuração privada e pastas de dados ficam fora.
py-modules = [
  "ad_attribution",
  "business_identity",
  "business_recompra",
  "meta_events",
  "meta_ads_native",
  "meta_ads_evidence",
  "run_meta_ads",
  "meta_ads_model",
  "meta_ads_sheets",
  "analytics",
  "analytics_history_sync",
  "bi_preflight",
  "duration_display",
  "versioning",
  "auditar_consistencia",
  "auditar_mudanca",
  "config",
  "contact_enrichment",
  "delivery_spreadsheets",
  "delivery_tickets",
  "diagnostico",
  "farmalider_client",
  "farmalider_integration",
  "farmalider_customers",
  "customer_discovery",
  "customer_observations",
  "google_sheets",
  "sheets_storage",
  "sheets_continuation",
  "sheets_partitions",
  "sheets_provisioning",
  "run_sheets_continuation",
  "run_sheets_console",
  "dedup_partitions",
  "sheets_migration",
  "sheets_native_copy",
  "run_sheets_migration",
  "geography",
  "geography_catalog",
  "logging_config",
  "looker_bi",
  "run_looker",
  "main",
  "network_diagnostics",
  "network_session",
  "nexo_cli",
  "observed_orders",
  "order_history",
  "order_history_store",
  "order_history_sheets",
  "history_capacity",
  "history_publication",
  "history_reconciliation",
  "history_sheets_transport",
  "history_publish_cli",
  "history_sheets_quota",
  "history_sheets_bulk",
  "history_batch_progress",
  "history_snapshot",
  "history_conference",
  "history_exclusions",
  "run_order_history",
  "pedido_utils",
  "private_diagnostics",
  "proxy_config",
  "project_paths",
  "runtime_profile",
  "recompra_group_audit",
  "recompra",
  "recompra_incremental",
  "recompra_cleanup",
  "recompra_profiles",
  "run_checkup_tests",
  "run_delivery_tickets",
  "run_diagnostico",
  "run_main",
  "run_noturno",
  "run_noturno_console",
  "run_pip",
  "run_recompra",
  "run_terminal",
  "run_update_weni",
  "run_webhook",
  "run_webhook_pedidos",
  "task_progress",
  "product_scope",
  "pet_catalog",
  "pharmacy_scope",
  "urn_utils",
  "webhook_eventos",
  "webhook_pedidos",
  "webhook_runtime",
  "weni_chats_client",
  "weni_client",
  "weni_update",
  "weni_dedup",
  "contact_dedup_guard",
  "dedup_io",
  "dedup_sheets",
  "dedup_bi",
  "recompra_lock",
  "recompra_review_audit",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
webhook = {file = ["dependencias/requirements-webhook.txt"]}

[tool.ruff]
src = ["app", "."]
target-version = "py311"
line-length = 88
extend-exclude = [
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
