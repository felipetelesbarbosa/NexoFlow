worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        location ~ ^/api/central/v1/(resumo|sessao|infraestrutura|consumo|documentacao/openapi\.json)$ {
            limit_except GET { deny all; }
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host central-api;
            proxy_set_header X-Central-Host $host;
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cf-Access-Jwt-Assertion;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_pass http://central-api:8000;
        }
        location ~ ^/api/central/v1/(minha-conta|usuarios(?:/revogar)?|convites(?:/aceitar|/cancelar)?)$ {
            limit_except GET PUT POST { deny all; }
            client_max_body_size 2k;
            proxy_pass_request_headers off;
            proxy_set_header Host central-api;
            proxy_set_header X-Central-Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_hide_header Set-Cookie;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_pass http://central-api:8000;
        }
        location /api/ { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
