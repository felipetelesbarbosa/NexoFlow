name: nexoflow-hub-hml
x-hub: &hub
  image: nexoflow-hub:hml
  build:
    context: ..
    dockerfile: hub/Dockerfile
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=16m,mode=1777']
  environment:
    HUB_AMBIENTE: homologacao
    HUB_ESCRITA_REAL: 'false'
    HUB_DSN_FILE: /run/secrets/dsn
    HUB_FARMA_TOKEN_FILE: /run/secrets/farma
    HUB_PET_TOKEN_FILE: /run/secrets/pet
  secrets:
    - source: dsn
      target: dsn
    - source: farma
      target: farma
    - source: pet
      target: pet
  networks: [interna]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
  pids_limit: 100
  mem_limit: 256m
  cpus: 1
services:
  postgres-hml:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: bootstrap_hml
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, runtime_password]
    volumes:
      - pg_hml:/var/lib/postgresql
      - ./init-hml.sql:/docker-entrypoint-initdb.d/01-hub.sql:ro
    networks: [interna]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bootstrap_hml -d postgres']
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migracao:
    <<: *hub
    profiles: [migracao]
    command: [python, -m, nexoflow_hub.migrate]
  api:
    <<: *hub
    networks:
      interna:
        aliases: [hub-api]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *hub
    command: [python, -m, nexoflow_hub.worker]
    healthcheck:
      test: [CMD, python, -m, nexoflow_hub.worker, --health]
      interval: 15s
      timeout: 7s
      retries: 3
networks:
  interna: {internal: true}
volumes:
  pg_hml:
secrets:
  dsn: {file: '${HUB_SEGREDOS_DIR:?diretorio privado obrigatório}/dsn'}
  farma: {file: '${HUB_SEGREDOS_DIR}/farma'}
  pet: {file: '${HUB_SEGREDOS_DIR}/pet'}
  admin_password: {file: '${HUB_SEGREDOS_DIR}/admin_password'}
  runtime_password: {file: '${HUB_SEGREDOS_DIR}/runtime_password'}
