name: Validar Meta Ads nativo e MCP somente leitura
on:
  push:
    branches: [main]
    paths:
      - 'connectors/meta_ads_mcp/**'
      - 'app/meta_ads_*.py'
      - 'app/run_meta_ads.py'
      - 'tests/test_meta_ads_*.py'
      - 'tests/test_meta_native_install.py'
      - 'tests/test_meta_native_pipeline.py'
      - 'tests/test_run_meta_ads.py'
      - 'scripts/instalar_meta_ads_mcp.ps1'
      - 'scripts/instalar_codex_cli.ps1'
      - 'installer/install.ps1'
      - 'tests/test_meta_optional_install.py'
      - 'tests/test_meta_environment_validator.py'
      - 'configuracao/meta_ads_credentials.example.json'
      - 'credentials/mcp/.gitignore'
      - '.github/workflows/meta-ads-mcp.yml'
  pull_request:
    paths:
      - 'connectors/meta_ads_mcp/**'
      - 'app/meta_ads_*.py'
      - 'app/run_meta_ads.py'
      - 'scripts/instalar_meta_ads_mcp.ps1'
      - '.github/workflows/meta-ads-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r connectors/meta_ads_mcp/requirements.txt ruff
      - run: ruff check connectors/meta_ads_mcp
      - run: python -m unittest discover -s connectors/meta_ads_mcp/tests -v
      - name: Validar integração nativa sem APIs ou planilhas reais
        run: python -m unittest tests.test_meta_ads_model tests.test_meta_ads_evidence tests.test_meta_ads_sheets tests.test_meta_ads_native tests.test_meta_native_pipeline tests.test_meta_analytics_hook tests.test_run_meta_ads -v
      - name: Validar instaladores opcionais com comandos simulados
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_meta_optional_install tests.test_meta_environment_validator -v
      - run: python -m pip check
