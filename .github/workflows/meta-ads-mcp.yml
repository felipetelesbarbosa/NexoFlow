name: Validar Meta Ads MCP somente leitura
on:
  push:
    branches: [main]
    paths:
      - 'connectors/meta_ads_mcp/**'
      - 'scripts/instalar_meta_ads_mcp.ps1'
      - 'scripts/instalar_codex_cli.ps1'
      - 'installer/install.ps1'
      - 'tests/test_meta_optional_install.py'
      - 'configuracao/meta_ads_credentials.example.json'
      - 'credentials/mcp/.gitignore'
      - '.github/workflows/meta-ads-mcp.yml'
  pull_request:
    paths:
      - 'connectors/meta_ads_mcp/**'
      - 'scripts/instalar_meta_ads_mcp.ps1'
      - '.github/workflows/meta-ads-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r connectors/meta_ads_mcp/requirements.txt ruff
      - run: ruff check connectors/meta_ads_mcp
      - run: python -m unittest discover -s connectors/meta_ads_mcp/tests -v
      - name: Validar instaladores opcionais com comandos simulados
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_meta_optional_install -v
      - run: python -m pip check
