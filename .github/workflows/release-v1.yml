# NexoFlow 1.0
name: Publicar NexoFlow 1.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexoflow-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-e-publicar:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python para testes
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          $cfg = Get-Content secrets_config.example.py -Raw
          $cfg = $cfg.Replace("COLE_SEU_TOKEN_WENI_AQUI", "TOKEN_TESTE_WENI")
          $cfg = $cfg.Replace("COLE_O_ID_DA_PLANILHA_GOOGLE_AQUI", "PLANILHA_TESTE")
          $cfg = $cfg.Replace("COLE_SEU_TOKEN_FARMALIDER_AQUI", "TOKEN_TESTE_FARMALIDER")
          [IO.File]::WriteAllText((Join-Path $PWD "secrets_config.py"), $cfg, (New-Object Text.UTF8Encoding($false)))

      - name: Executar testes
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Auditoria de consistencia
        shell: pwsh
        run: |
          python auditar_consistencia.py

      - name: Go para launcher do Setup
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Gerar pacotes 1.0
        shell: pwsh
        run: |
          ./scripts/build_release.ps1 -Version "1.0"

      - name: Validar icones incorporados nos executaveis
        shell: pwsh
        run: |
          ./scripts/test_executable_icons.ps1 -Version "1.0"

      - name: Smoke test do Setup 1.0 no Windows
        shell: pwsh
        run: |
          ./scripts/test_setup_windows.ps1 -SetupZip "dist/NexoFlow-Setup-1.0.zip"

      - name: Disponibilizar pacotes do NexoFlow 1.0
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NexoFlow-1.0-pacotes
          path: |
            dist/NexoFlow-Setup-1.0.zip
            dist/NexoFlow-1.0.zip
            dist/SHA256SUMS-1.0.txt
          if-no-files-found: error
          retention-days: 7

      - name: Atualizar tag v1.0
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git tag -f v1.0 "$env:GITHUB_SHA"
          git push origin refs/tags/v1.0 --force

      - name: Publicar NexoFlow 1.0 no GitHub
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0 "dist/NexoFlow-Setup-1.0.zip" "dist/NexoFlow-1.0.zip" "dist/SHA256SUMS-1.0.txt" --clobber
          gh release edit v1.0 --title "NexoFlow 1.0" --notes-file "dist/release-notes.md"

      - name: Resumo
        shell: pwsh
        run: |
          Get-Content "dist/SHA256SUMS-1.0.txt"
