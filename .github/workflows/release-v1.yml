# Automação de testes, empacotamento e publicação do NexoFlow 1.5.35.
name: Publicar NexoFlow 1.5.35

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar release após validação
        type: boolean
        default: false
      validated_run_id:
        description: ID da execução aprovada cujos pacotes serão publicados sem novo build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A publicação manual não deve cancelar os checks disparados pelo push.
  # Publicações manuais aguardam a anterior; pushes substituem checks antigos.
  group: nexoflow-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  qualidade:
    if: ${{ !inputs.validated_run_id }}
    name: Qualidade e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Instalar ferramentas de verificação
        run: python -m pip install -r requirements.txt -r dependencias/requirements-webhook.txt -r dependencias/requirements-dev.txt
      - name: Validar código e tipos
        run: |
          ruff check .
          pyright
      - name: Testar leitores Data Studio e histórico completo
        run: node --test tests/test_continuation_connector.cjs tests/test_looker_abc_connector.cjs tests/test_history_connector.cjs tests/test_legacy_items_connector.cjs tests/test_connector_transport.cjs
      - name: Auditar dependências
        run: pip-audit -r requirements.txt -r dependencias/requirements-webhook.txt

  verificar-segredos:
    if: ${{ !inputs.validated_run_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do histórico completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks com SHA-256 conferido
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/nexoflow-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks

      - name: Verificar segredos em todo o histórico Git
        shell: bash
        run: |
          python3 scripts/check_release_secrets.py \
            --scanner "$RUNNER_TEMP/nexoflow-gitleaks/gitleaks" \
            --mode history --repo "$GITHUB_WORKSPACE"

  validar-python:
    if: ${{ !inputs.validated_run_id }}
    name: Testes Python ${{ matrix.python-version }}
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install "setuptools>=77" wheel
          python -m pip install -r requirements.txt -r dependencias/requirements-webhook.txt

      - name: Testar compatibilidade sem APIs reais
        shell: pwsh
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Os testes de compatibilidade Python falharam." }
          python scripts/build_documentation.py --check
          if ($LASTEXITCODE -ne 0) { throw "A documentação HTML está desatualizada." }

      - name: Testar com a codificação padrão do Windows
        shell: pwsh
        env:
          PYTHONUTF8: "0"
        run: |
          python -m unittest discover -s tests -t . -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Os testes de leitura com a codificação padrão do Windows falharam." }

  validar-e-publicar:
    # Integrações preparatórias explicitamente autorizadas sem release.
    if: ${{ !inputs.validated_run_id && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') || contains(github.event.head_commit.message, '[preparar pacotes]')) }}
    needs: [qualidade, verificar-segredos, validar-python]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir padrão da publicação
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "A publicação do NexoFlow 1.5.35 deve partir da main."
          }

      - name: Go para launcher do Setup
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"

      - name: Testar menu e console real do NexoFlow Noturno
        shell: pwsh
        env:
          GO111MODULE: 'off'
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('nexoflow-segment-baseline-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          Copy-Item native_launcher/*.go -Destination $fixture
          $baseline = & git show 7489011c6a6806d20f4a30049b02c33b75a867e9:native_launcher/common.go
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível preparar a regressão da versão anterior." }
          [IO.File]::WriteAllLines((Join-Path $fixture 'common.go'), $baseline, [Text.UTF8Encoding]::new($false))
          Push-Location $fixture
          try {
            $proof = & go test -tags noturno -run '^TestSegmentLocksAllowDifferentProfilesAndBlockSameProfile$' . 2>&1
            $failed = $LASTEXITCODE -ne 0
            Write-Host ($proof | Out-String)
            if (-not $failed -or ($proof | Out-String) -notmatch '(FARMA bloqueou PET|admitiu duas cargas FARMA)') {
              throw "A regressão não reproduziu a falha de isolamento da versão anterior."
            }
            Write-Host '[OK] Regressão reproduzida: a versão anterior falha no contrato de isolamento por segmento.'
          } finally { Pop-Location; Remove-Item -LiteralPath $fixture -Recurse -Force }
          go test -v -tags noturno ./native_launcher
          if ($LASTEXITCODE -ne 0) { throw "Falha no menu ou na espera do console do NexoFlow Noturno." }

      - name: Python para testes
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel
          python -m pip install -r requirements.txt -r dependencias/requirements-webhook.txt

      # A suíte completa já passou na matriz 3.11/3.14, nas duas codificações.
      # Este job mantém os testes do pacote/executáveis/Setup, sem uma quinta suíte.
      - name: Executar check-up operacional
        shell: pwsh
        run: |
          python app/run_checkup_tests.py
          if ($LASTEXITCODE -ne 0) { throw "O check-up operacional falhou." }

      - name: Auditoria de consistência
        shell: pwsh
        run: |
          python app/auditar_consistencia.py

      - name: Testar contratos de assinatura sem chaves reais
        shell: pwsh
        run: ./scripts/test_sign_release.ps1

      - name: Testar proteção da manutenção entre segmentos
        shell: pwsh
        run: ./scripts/test_segment_lock_windows.ps1

      - name: Gerar pacotes 1.5.35
        shell: pwsh
        run: |
          ./scripts/build_release.ps1 -Version "1.5.35"

      - name: Conferir contrato da revisão histórica nos dois pacotes
        shell: pwsh
        run: |
          python scripts/check_history_quota_contract.py --assets-dir dist --version "1.5.35"
          if ($LASTEXITCODE -ne 0) { throw "Os pacotes alteraram o contrato da revisão histórica." }

      - name: Validar ícones incorporados nos executáveis
        shell: pwsh
        run: |
          ./scripts/test_executable_icons.ps1 -Version "1.5.35"

      - name: Testar Weni com BAT sintético e inspeção durante carga ativa
        shell: pwsh
        run: ./scripts/test_weni_launcher_windows.ps1

      - name: Testar executável Recompra + BAT no Windows
        shell: pwsh
        run: |
          ./scripts/test_recompra_launcher_windows.ps1

      - name: Testar executável Noturno sem APIs
        shell: pwsh
        run: |
          ./scripts/test_noturno_launcher_windows.ps1

      - name: Smoke test do Setup 1.5.35 no Windows
        shell: pwsh
        run: |
          ./scripts/test_setup_windows.ps1 -SetupZip "dist/NexoFlow-Setup-1.5.35.zip"

      - name: Disponibilizar pacotes do NexoFlow 1.5.35
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NexoFlow-1.5.35-pacotes
          path: |
            dist/NexoFlow-Setup-1.5.35.zip
            dist/NexoFlow-1.5.35.zip
            dist/SHA256SUMS-1.5.35.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Resumo
        shell: pwsh
        run: |
          Get-Content "dist/SHA256SUMS-1.5.35.txt"

  verificar-pacotes:
    if: ${{ !inputs.validated_run_id && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [verificar-segredos, validar-e-publicar]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do commit validado
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Receber pacotes para análise
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NexoFlow-1.5.35-pacotes
          path: dist

      - name: Instalar Gitleaks com SHA-256 conferido
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/nexoflow-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks

      - name: Conferir hashes e verificar segredos dentro dos ZIPs
        shell: bash
        run: |
          python3 scripts/check_release_secrets.py \
            --scanner "$RUNNER_TEMP/nexoflow-gitleaks/gitleaks" \
            --mode packages --repo "$GITHUB_WORKSPACE" --assets-dir "$GITHUB_WORKSPACE/dist"

  publicar:
    if: ${{ !inputs.validated_run_id && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]') && (github.event_name != 'workflow_dispatch' || inputs.publish_release) }}
    needs: [verificar-segredos, validar-e-publicar, verificar-pacotes]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps: &publicar_steps
      - name: Checkout do commit validado
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Python para conferir os pacotes sem reinstalar dependências
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Conferir a execução reutilizada antes de receber os pacotes
        if: inputs.validated_run_id
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release }}
        run: |
          if ($env:PUBLISH_REQUESTED -cne 'true') { throw 'Reutilização exige publish_release=true.' }
          python scripts/validate_release_run.py --repo "$env:GITHUB_REPOSITORY" --sha "$env:GITHUB_SHA" --run-id "$env:VALIDATED_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'A execução de origem não autoriza publicação.' }

      - name: Receber pacotes validados
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: NexoFlow-1.5.35-pacotes
          path: dist
          run-id: ${{ inputs.validated_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Revalidar os bytes dos pacotes antes de publicar
        shell: pwsh
        run: |
          python scripts/validate_release_run.py --assets-dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Pacotes recebidos não foram confirmados.' }

      - name: Conferir o commit atual da main
        shell: pwsh
        run: |
          $remoteMain = (& git ls-remote --exit-code origin refs/heads/main | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível conferir a main antes de publicar." }
          $latestSha = ($remoteMain -split '\s+')[0]
          if ($latestSha -cne $env:GITHUB_SHA) {
            throw "A main recebeu outro commit. O release deve usar a execução mais recente."
          }

      - name: Preservar ou criar tag v1.5.35
        shell: pwsh
        run: |
          $existing = (& git ls-remote origin refs/tags/v1.5.35 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Falha ao consultar a tag v1.5.35." }
          if ($existing) {
            if (($existing -split '\s+')[0] -cne $env:GITHUB_SHA) {
              throw "A versão 1.5.35 já foi usada por outro commit. Incremente o patch antes de publicar."
            }
          } else {
            git tag v1.5.35 "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Falha ao preparar a tag v1.5.35." }
            git push origin refs/tags/v1.5.35
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a tag v1.5.35." }
          }

      - name: Publicar NexoFlow 1.5.35 no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isDraft = (& gh release view v1.5.35 --json isDraft --jq '.isDraft' 2>$null | Out-String).Trim()
          if ($LASTEXITCODE -eq 0) {
            if ($isDraft -cne 'true') {
              throw "A versão 1.5.35 já foi publicada. Incremente o patch para entregar novo código; não sobrescreva pacotes públicos."
            }
          } else {
            gh release create v1.5.35 --verify-tag --title "NexoFlow 1.5.35" --notes-file "dist/release-notes.md" --draft
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar o rascunho NexoFlow 1.5.35." }
          }
          # Somente um rascunho da mesma entrega pode receber artefatos novamente.
          gh release upload v1.5.35 "dist/NexoFlow-Setup-1.5.35.zip" "dist/NexoFlow-1.5.35.zip" "dist/SHA256SUMS-1.5.35.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar os pacotes do NexoFlow 1.5.35." }
          gh release edit v1.5.35 --title "NexoFlow 1.5.35" --notes-file "dist/release-notes.md" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o NexoFlow 1.5.35." }

          # A data vem do instante publicado pelo GitHub, após a publicação real.
          $publishedAt = (& gh release view v1.5.35 --json publishedAt --jq '.publishedAt' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $publishedAt) { throw "Falha ao conferir a data real da publicação." }
          try { $publicationZone = [TimeZoneInfo]::FindSystemTimeZoneById('America/Fortaleza') }
          catch { $publicationZone = [TimeZoneInfo]::FindSystemTimeZoneById('SA Eastern Standard Time') }
          $publicationDate = [TimeZoneInfo]::ConvertTime([DateTimeOffset]::Parse($publishedAt), $publicationZone).ToString('dd/MM/yyyy')
          $notes = [IO.File]::ReadAllText((Join-Path $PWD 'dist/release-notes.md'))
          $title, $content = $notes -split "\r?\n", 2
          $datedNotes = "$title`n`nPublicado em **$publicationDate** (America/Fortaleza).`n`n" + $content.TrimStart([char[]]"`r`n")
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/release-notes.md'), $datedNotes, (New-Object Text.UTF8Encoding($false)))
          gh release edit v1.5.35 --notes-file "dist/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Release publicado, mas não foi possível registrar a data nas notas." }

      - name: Resumo
        shell: pwsh
        run: |
          Get-Content "dist/SHA256SUMS-1.5.35.txt"

  publicar-validado:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validated_run_id }}
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps: *publicar_steps
