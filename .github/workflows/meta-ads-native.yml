name: Validar Meta Ads nativo somente leitura
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app/meta_ads_*.py'
      - 'app/run_meta_ads.py'
      - 'configuracao/meta_ads_credentials.example.json'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tests/test_meta_*.py'
      - 'tests/test_run_meta_ads.py'
      - '.github/workflows/meta-ads-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt "setuptools>=77" wheel ruff
      - run: ruff check app/meta_ads_client.py app/meta_ads_settings.py
      - name: Validar cliente, isolamento e transporte Meta sem APIs reais
        run: python -m unittest tests.test_meta_ads_client tests.test_meta_ads_client_security tests.test_meta_ads_client_transport -v
      - name: Validar integração e pacote nativos sem APIs ou planilhas reais
        run: python -m unittest tests.test_meta_native_install tests.test_meta_ads_model tests.test_meta_ads_evidence tests.test_meta_ads_sheets tests.test_meta_ads_native tests.test_meta_native_pipeline tests.test_meta_analytics_hook tests.test_run_meta_ads -v
      - run: python -m pip check
